# Production on the ZOZ server: behind the central Traefik proxy (shared "web-network"), like zoz-website.
# The deploy workflow copies this file to DEPLOY_PATH/docker-compose.yml and writes DEPLOY_PATH/.env
# (RADEON_API_KEY from the GitHub secret). Local development uses the docker-compose.yml in the repo root.
services:
  paperops:
    image: ghcr.io/zozinnovations/paperops:latest
    container_name: paperops
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      PUBLIC_URL: "https://paperops.zozinnovations.com"
      ALLOW_PRINTER_SETUP: "0"   # never on a public server
    networks:
      - web-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperops.rule=Host(`paperops.zozinnovations.com`)"
      - "traefik.http.routers.paperops.entrypoints=websecure"
      - "traefik.http.routers.paperops.tls.certresolver=cloudflare"
      - "traefik.http.services.paperops.loadbalancer.server.port=8000"
    # security hardening: read-only root filesystem, no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs:
      - /tmp
      - /app/cache:uid=10001,gid=10001
      - /home/paperops:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  web-network:
    external: true
