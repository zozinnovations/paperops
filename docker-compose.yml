services:
  paperops:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    env_file: .env
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"   # port inside the container; HOST_PORT is the one on your machine
    # security hardening: read-only root filesystem, no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs:
      - /tmp
      - /app/cache:uid=10001,gid=10001
      - /home/paperops:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # HTTPS for the hosted demo (browsers only allow the microphone over HTTPS).
  # Set DOMAIN in .env, point its DNS to the server, then: docker compose --profile https up -d
  caddy:
    image: caddy:2.8
    profiles: ["https"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to paperops:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - paperops
    restart: unless-stopped

volumes:
  caddy_data:
