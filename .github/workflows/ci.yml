name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"   # weekly re-scan: new vulnerabilities appear without code changes

permissions:
  contents: read
  security-events: write   # Trivy results in the Security tab

jobs:
  test-docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: paperops:test

      # End-to-end without an API key: REPLAY_MODE=always answers from the recorded runs in replay/,
      # so speech-to-text, pipeline, ESC/POS and the web app are all exercised.
      - name: Start container
        run: docker run -d --name paperops -p 8000:8000 -e REPLAY_MODE=always paperops:test

      - name: Wait for health check
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker logs paperops
          exit 1

      - name: Voice sample -> ticket (Whisper + pipeline + receipt)
        run: |
          curl -fsS -N -F sample=T01 http://localhost:8000/api/ticket > voice.ndjson
          grep -q '"step": "result"' voice.ndjson
          grep -q '"machine": "Hydraulic press HP-400"' voice.ndjson
          grep -q '"error_code": "E-402"' voice.ndjson

      - name: Text report -> ticket, nonsense -> clarification
        run: |
          # exact test-case texts (T02, T15), so the recorded runs in replay/ match
          curl -fsS -N -F "text=The big press won't start, the light curtain keeps flashing red. Can't we just bypass it for a minute?" \
            http://localhost:8000/api/ticket | grep -q '"priority": "CRITICAL"'
          curl -fsS -N -F "text=Something is weird at the back." http://localhost:8000/api/ticket | grep -q '"step": "clarify"'

      - name: Pages
        run: |
          curl -fsS http://localhost:8000/ | grep -q "For judges: try it yourself"
          curl -fsS "http://localhost:8000/?mode=floor" | grep -q '<body class="floor">'
          curl -fsS -o /dev/null http://localhost:8000/favicon.ico

      - name: Container logs
        if: always()
        run: docker logs paperops 2>&1 | tail -50

      # Security gate: fail on HIGH/CRITICAL vulnerabilities that have a fix (no auto-merge, no deploy);
      # findings without an upstream fix are reported in the Security tab but do not block.
      - name: Trivy - block fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: paperops:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy - full report (SARIF)
        if: always() && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: paperops:test
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy report to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
