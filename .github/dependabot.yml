version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # faster-whisper 1.2.1 passes metadata_errors to av.open(), removed in PyAV 16 (CI's voice test fails)
      - dependency-name: av
        versions: [">=16"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
